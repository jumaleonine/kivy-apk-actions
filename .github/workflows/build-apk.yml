name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential ccache

      - name: Install Buildozer
        run: pip install buildozer "cython<3"

      - name: Build debug APK
        run: |
          buildozer -v android debug > build.log 2>&1 || {
            cut -c1-220 build.log > short.log
            N=$(grep -n -m1 -E "Command failed|[^a-z]error:|Traceback" short.log | cut -d: -f1)
            N=${N:-60}
            S=$((N - 25))
            [ "$S" -lt 1 ] && S=1
            echo "=== FIRST FAILURE AND CONTEXT ==="
            sed -n "${S},$((N + 5))p" short.log
            echo "::error::$(sed -n "${S},${N}p" short.log | tail -n 6 | tr '\n' ' ' | cut -c1-900)"
            exit 1
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore