name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential ccache

      - name: Install Buildozer
        run: pip install buildozer "cython<3"

      - name: Build debug APK
        run: |
          buildozer -v android debug > build.log 2>&1 || {
            echo "=== LIKELY ERROR LINES ==="
            grep -n -i -E "command failed|error:|traceback|fatal|no such file|cannot find|undefined reference" build.log | grep -v -E "GITHUB_|RUNNER|ImageOS" | tail -n 30
            ERRS=$(grep -i -E "command failed|error:|traceback|fatal|undefined reference" build.log | grep -v -E "GITHUB_|RUNNER|ImageOS" | tail -n 5 | tr '\n' ' ')
            echo "::error::$ERRS"
            exit 1
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore